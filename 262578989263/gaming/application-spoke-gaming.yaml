apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spoke-gaming
  namespace: argocd1
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: spoke-gaming
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: gaming
    cloudman.io/user: rmay-struct
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: proj2
  source:
    repoURL: "https://github.com/Struct8/TestArgo.git"
    targetRevision: HEAD
    path: 262578989263/gaming/templates
  destination:
    name: spoke
    namespace: gaming
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
