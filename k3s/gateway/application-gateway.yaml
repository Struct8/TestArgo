apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd2
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: gateway
    cloudman.io/creator: Templates
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: proj2
  source:
    repoURL: "https://github.com/Struct8/TestArgo.git"
    targetRevision: HEAD
    path: k3s/gateway/templates
  destination:
    server: "https://kubernetes.default.svc"
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
