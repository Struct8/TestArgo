apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-monitoring1-k3s-struct8-agent-k3s
  namespace: struct8-agent-k3s
  labels:
    struct8.io/origin: route-monitoring1-k3s
    app.kubernetes.io/name: route-monitoring1-k3s-struct8-agent-k3s
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: struct8-agent1-k3s
    cloudman.io/creator: rmay-struct
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  parentRefs:
    - name: boutique-gateway
      namespace: gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: struct8-agent-k3s-svc
          namespace: struct8-agent-k3s
          port: 80
  hostnames:
    - agent1.k8h.admin.billingpay.com.br
