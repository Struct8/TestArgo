apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: struct8-agent1-k3s
  namespace: argocd2
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: struct8-agent1-k3s
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: struct8-agent1-k3s
    cloudman.io/creator: rmay-struct
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: proj2
  source:
    repoURL: "https://github.com/Struct8/TestArgo.git"
    targetRevision: HEAD
    path: k3s/struct8-agent1-k3s/templates
  destination:
    server: "https://kubernetes.default.svc"
    namespace: struct8-agent-k3s
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
