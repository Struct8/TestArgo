apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  labels:
    app.kubernetes.io/name: recommendationservice
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: on-line-boutique
    cloudman.io/creator: Anderson-Dutra
  namespace: online-boutique
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  minReadySeconds: 0
  paused: false
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Always
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      serviceAccountName: deployment-recommendationservice-v1-sa
      containers:
        - image: "us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/recommendationservice:v0.10.6"
          imagePullPolicy: Always
          name: recommendationservice
          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice-svc:3550"
            - name: DISABLE_PROFILER
              value: "1"
            - name: PRODUCTCATALOGSERVICE_HOST
              value: "productcatalogservice-svc"
            - name: PRODUCTCATALOGSERVICE_PORT
              value: "3550"
          livenessProbe:
            grpc:
              port: 8080
          ports:
            - containerPort: 8080
              name: grpc
          readinessProbe:
            grpc:
              port: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "220Mi"
            limits:
              cpu: "200m"
              memory: "450Mi"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
    metadata:
      labels:
        app.kubernetes.io/name: recommendationservice
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendationservice
