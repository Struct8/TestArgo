apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: on-line-boutique
    cloudman.io/creator: Anderson-Dutra
  namespace: online-boutique
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  minReadySeconds: 0
  paused: false
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Always
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      serviceAccountName: deployment-frontend-v1-sa
      containers:
        - image: "us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend:v0.10.6"
          imagePullPolicy: Always
          name: frontend
          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice-svc:3550"
            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice-svc:7000"
            - name: CART_SERVICE_ADDR
              value: "cartservice-svc:7070"
            - name: RECOMMENDATION_SERVICE_ADDR
              value: "recommendationservice-svc:8080"
            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice-svc:50051"
            - name: CHECKOUT_SERVICE_ADDR
              value: "checkoutservice-svc:5050"
            - name: AD_SERVICE_ADDR
              value: "adservice-svc:9555"
            - name: SHOPPING_ASSISTANT_SERVICE_ADDR
              value: "shoppingassistantservice-svc:80"
            - name: ENABLE_PROFILER
              value: "0"
            - name: PRODUCTCATALOGSERVICE_HOST
              value: "productcatalogservice-svc"
            - name: PRODUCTCATALOGSERVICE_PORT
              value: "3550"
            - name: CURRENCYSERVICE_HOST
              value: "currencyservice-svc"
            - name: CURRENCYSERVICE_PORT
              value: "7000"
            - name: CARTSERVICE_HOST
              value: "cartservice-svc"
            - name: CARTSERVICE_PORT
              value: "7070"
            - name: RECOMMENDATIONSERVICE_HOST
              value: "recommendationservice-svc"
            - name: RECOMMENDATIONSERVICE_PORT
              value: "8080"
            - name: SHIPPINGSERVICE_HOST
              value: "shippingservice-svc"
            - name: SHIPPINGSERVICE_PORT
              value: "50051"
            - name: CHECKOUTSERVICE_HOST
              value: "checkoutservice-svc"
            - name: CHECKOUTSERVICE_PORT
              value: "5050"
            - name: ADSERVICE_HOST
              value: "adservice-svc"
            - name: ADSERVICE_PORT
              value: "9555"
          livenessProbe:
            httpGet:
              path: /_healthz
              port: 8080
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /_healthz
              port: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
    metadata:
      labels:
        app.kubernetes.io/name: frontend
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
