name: Permission probe

# Disposable. This file exists only to prove that the Struct8 GitHub App is
# allowed to write under .github/workflows/ -- a permission the GitHub API
# checks at commit time, before any workflow ever runs.
#
# Manual trigger only, on purpose: it must never fire by itself. It touches no
# cloud credential and no registry. Delete it once the answer is known.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The GitHub App can write workflow files."
