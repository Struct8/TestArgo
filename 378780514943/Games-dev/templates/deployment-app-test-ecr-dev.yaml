apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-test-ecr-dev
  labels:
    app.kubernetes.io/name: app-test-ecr-dev
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: Games-dev
    cloudman.io/creator: rmay-struct
  namespace: gamestest-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  template:
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      serviceAccountName: deployment-app-test-ecr-dev-v1-sa
      containers:
        - image: "262578989263.dkr.ecr.us-east-1.amazonaws.com/repo-k8hub:v5"
          imagePullPolicy: IfNotPresent
          name: games-web
          stdin: false
          stdinOnce: false
          tty: false
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
    metadata:
      labels:
        app.kubernetes.io/name: app-test-ecr-dev
  selector:
    matchLabels:
      app.kubernetes.io/name: app-test-ecr-dev
