apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-kuma-dev-3001
  namespace: gamestest-dev
  labels:
    app.kubernetes.io/name: allow-gateway-to-kuma-dev-3001
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: Games-dev
    cloudman.io/creator: rmay-struct
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kuma-dev
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-dev
      ports:
        - protocol: TCP
          port: 3001
