apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: games-dev-kuma-dev
  namespace: gamestest-dev
  labels:
    struct8.io/origin: games-dev
    app.kubernetes.io/name: games-dev-kuma-dev
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: Games-dev
    cloudman.io/creator: Anderson-Dutra
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  parentRefs:
    - name: gapi-dev
      namespace: infra-dev
      sectionName: g-api-dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kuma-dev-svc
          namespace: gamestest-dev
          port: 80
  hostnames:
    - kuma.k8s.admin.billingpay.com.br
